<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoxSight</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/accessibility.css">
</head>
<body>
  <div id="app">
    <header class="header panel fade-in fade-in--1">
      <div class="brand">
        <p class="brand__eyebrow">Accessible AI Navigator</p>
        <h1 class="header__title">VoxSight</h1>
      </div>
      <div class="settings-bar">
        <button id="contrastBtn" class="settings-btn" aria-label="Toggle high contrast" title="High contrast">HC</button>
        <button id="fontSizeBtn" class="settings-btn" aria-label="Cycle font size" title="Font size">A+</button>
        <label class="language-picker" for="languageSelect">
          <span class="language-picker__label">Lang</span>
          <select id="languageSelect" class="language-picker__select" aria-label="Language mode">
            <option value="auto">Auto</option>
            <option value="zh">中文</option>
            <option value="en">English</option>
          </select>
        </label>
      </div>
    </header>

    <section id="pageDescription" class="page-description panel fade-in fade-in--2" aria-live="polite" role="status">
      <div class="page-description__head">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="page-description__label">Live Summary</span>
      </div>
      <p class="page-description__text">Press the microphone button or Space to start</p>
    </section>

    <section id="conversation" class="conversation panel fade-in fade-in--3" role="log" aria-label="Conversation history">
    </section>

    <section id="confirmPanel" class="confirm-panel panel" hidden>
      <p id="confirmText" class="confirm-panel__text">Please confirm this action.</p>
      <div class="confirm-panel__actions">
        <button id="confirmYesBtn" class="confirm-btn confirm-btn--yes" aria-label="Confirm action">Confirm</button>
        <button id="confirmNoBtn" class="confirm-btn confirm-btn--no" aria-label="Cancel action">Cancel</button>
      </div>
    </section>

    <footer class="controls panel fade-in fade-in--4">
      <div class="voice-controls">
        <button id="voiceBtn" class="voice-btn" aria-label="Hold to speak" title="Hold Space or click to speak">
          <svg class="voice-btn__icon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
          <span class="voice-btn__label">Hold to speak</span>
        </button>
        <input id="textInput" class="text-input" type="text" placeholder="Type a command..." aria-label="Text command input" style="display:none;">
      </div>
      <div class="quick-actions">
        <button id="describeBtn" class="quick-btn" aria-label="Describe page">Describe page</button>
        <button id="readBtn" class="quick-btn" aria-label="Read content">Read content</button>
      </div>
    </footer>
  </div>
  <script type="module" src="main.ts"></script>
</body>
</html>
