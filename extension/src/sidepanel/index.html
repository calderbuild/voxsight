<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoxSight</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <h1 class="header__title">VoxSight</h1>
      <button id="settingsBtn" class="header__settings" aria-label="Settings" title="Settings">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
          <path d="M10 13a3 3 0 100-6 3 3 0 000 6zm7.5-3c0 .34-.03.67-.08 1l2.17 1.7a.5.5 0 01.12.64l-2.06 3.56a.5.5 0 01-.61.22l-2.56-1.03a7.5 7.5 0 01-1.73 1l-.39 2.72a.5.5 0 01-.5.42H7.14a.5.5 0 01-.5-.42l-.39-2.72a7.5 7.5 0 01-1.73-1L2.96 16.12a.5.5 0 01-.61-.22L.29 12.34a.5.5 0 01.12-.64L2.58 11A7.7 7.7 0 012.5 10c0-.34.03-.67.08-1L.41 7.3a.5.5 0 01-.12-.64L2.35 3.1a.5.5 0 01.61-.22l2.56 1.03a7.5 7.5 0 011.73-1l.39-2.72A.5.5 0 018.14.77h4.12c.24 0 .45.17.5.42l.39 2.72a7.5 7.5 0 011.73 1l2.56-1.03a.5.5 0 01.61.22l2.06 3.56a.5.5 0 01-.12.64L17.82 9c.05.33.08.66.08 1z"/>
        </svg>
      </button>
    </header>

    <section id="pageDescription" class="page-description" aria-live="polite" role="status">
      <p class="page-description__text">Press the microphone button or Space to start</p>
    </section>

    <section id="conversation" class="conversation" role="log" aria-label="Conversation history">
    </section>

    <footer class="controls">
      <div class="voice-controls">
        <button id="voiceBtn" class="voice-btn" aria-label="Hold to speak" title="Hold Space or click to speak">
          <svg class="voice-btn__icon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
          <span class="voice-btn__label">Hold to speak</span>
        </button>
        <input id="textInput" class="text-input" type="text" placeholder="Type a command..." aria-label="Text command input" style="display:none;">
      </div>
      <div class="quick-actions">
        <button id="describeBtn" class="quick-btn" aria-label="Describe page">Describe page</button>
        <button id="readBtn" class="quick-btn" aria-label="Read content">Read content</button>
      </div>
    </footer>
  </div>
  <script type="module" src="main.ts"></script>
</body>
</html>
